name: Build and Release Plugin

# MOS Hub installs plugins by downloading a Debian package (.deb) matching
# the selected architecture from this repo's latest GitHub release. Release
# tags must be bare version numbers (e.g. "1.0.2"), NOT "v1.0.2" - MOS Hub
# can't recognize a "v"-prefixed tag as a valid version, which is why
# earlier v-prefixed releases weren't tracked as installed correctly across
# reboots.

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build plugin page
        working-directory: page
        run: |
          npm install
          npm run build

      - name: Build .deb packages
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="0.0.0-dev"
          fi

          for ARCH in amd64 arm64; do
            PKGDIR="pkg-$ARCH"
            mkdir -p "$PKGDIR/DEBIAN" "$PKGDIR/var/www/mos-plugins/breaker-box" \
              "$PKGDIR/usr/local/lib/breaker-box-watcher" "$PKGDIR/etc/init.d"

            cp page/dist/remoteEntry.js "$PKGDIR/var/www/mos-plugins/breaker-box/"
            cp page/dist/manifest.json "$PKGDIR/var/www/mos-plugins/breaker-box/"
            cp page/dist/style.css "$PKGDIR/var/www/mos-plugins/breaker-box/"
            cp page/dist/__federation_*.js "$PKGDIR/var/www/mos-plugins/breaker-box/"

            cp watcher/watcher.js "$PKGDIR/usr/local/lib/breaker-box-watcher/watcher.js"
            cp watcher/breaker-box-watcher.init "$PKGDIR/etc/init.d/breaker-box-watcher"
            chmod 755 "$PKGDIR/etc/init.d/breaker-box-watcher"

            cat > "$PKGDIR/DEBIAN/control" <<EOF
          Package: breaker-box
          Version: $VERSION
          Architecture: $ARCH
          Maintainer: websterwh
          Description: Breaker Box
           Flip a Cloudflare Worker's MODE secret (maintenance / restarting /
           off) from a button in MOS, via your own Cloudflare API token and
           a small CORS proxy Worker. Includes an optional background
           watcher service that flips it automatically on a real Docker
           container restart.
          EOF

            cat > "$PKGDIR/DEBIAN/postinst" <<'EOF'
          #!/bin/bash
          if command -v update-rc.d >/dev/null 2>&1; then
            update-rc.d breaker-box-watcher defaults >/dev/null 2>&1 || true
          fi
          # restart, not start: on an upgrade the old process is already
          # running under this pidfile, and `start` skips launching a
          # second one - the new watcher.js on disk never actually takes
          # over until something restarts it. restart's stop-then-start
          # picks up new code on both a fresh install and an upgrade.
          /etc/init.d/breaker-box-watcher restart >/dev/null 2>&1 || true
          exit 0
          EOF
            chmod +x "$PKGDIR/DEBIAN/postinst"

            cat > "$PKGDIR/DEBIAN/postrm" <<'EOF'
          #!/bin/bash
          /etc/init.d/breaker-box-watcher stop >/dev/null 2>&1 || true
          if command -v update-rc.d >/dev/null 2>&1; then
            update-rc.d -f breaker-box-watcher remove >/dev/null 2>&1 || true
          fi
          rm -f /run/breaker-box-watcher.pid 2>/dev/null || true
          exit 0
          EOF
            chmod +x "$PKGDIR/DEBIAN/postrm"

            dpkg-deb --root-owner-group --build "$PKGDIR" "breaker-box_${VERSION}_${ARCH}.deb"
          done

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            breaker-box_*_amd64.deb
            breaker-box_*_arm64.deb
