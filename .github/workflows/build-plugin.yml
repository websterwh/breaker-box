name: Build and Release Plugin

# MOS Hub installs plugins by downloading a Debian package (.deb) matching
# the selected architecture from this repo's latest GitHub release. Release
# tags must be bare version numbers (e.g. "1.0.2"), NOT "v1.0.2" - MOS Hub
# can't recognize a "v"-prefixed tag as a valid version, which is why
# earlier v-prefixed releases weren't tracked as installed correctly across
# reboots.

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build plugin page
        working-directory: page
        run: |
          npm install
          npm run build

      - name: Build .deb packages
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="0.0.0-dev"
          fi

          for ARCH in amd64 arm64; do
            PKGDIR="pkg-$ARCH"
            mkdir -p "$PKGDIR/DEBIAN" "$PKGDIR/var/www/mos-plugins/breaker-box"

            cp page/dist/remoteEntry.js "$PKGDIR/var/www/mos-plugins/breaker-box/"
            cp page/dist/manifest.json "$PKGDIR/var/www/mos-plugins/breaker-box/"
            cp page/dist/style.css "$PKGDIR/var/www/mos-plugins/breaker-box/"
            cp page/dist/__federation_*.js "$PKGDIR/var/www/mos-plugins/breaker-box/"

            cat > "$PKGDIR/DEBIAN/control" <<EOF
          Package: breaker-box
          Version: $VERSION
          Architecture: $ARCH
          Maintainer: websterwh
          Description: Breaker Box
           Flip a Cloudflare Worker's MODE secret (maintenance / restarting /
           off) from a button in MOS, via your own Cloudflare API token and
           a small CORS proxy Worker.
          EOF

            cat > "$PKGDIR/DEBIAN/postinst" <<'EOF'
          #!/bin/bash
          exit 0
          EOF
            chmod +x "$PKGDIR/DEBIAN/postinst"

            cat > "$PKGDIR/DEBIAN/postrm" <<'EOF'
          #!/bin/bash
          exit 0
          EOF
            chmod +x "$PKGDIR/DEBIAN/postrm"

            dpkg-deb --root-owner-group --build "$PKGDIR" "breaker-box_${VERSION}_${ARCH}.deb"
          done

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            breaker-box_*_amd64.deb
            breaker-box_*_arm64.deb
